<!doctype html><html><head><meta charset="utf-8"><title>Lab sandbox verification</title></head><body><h1>Generated-code isolation checks</h1><button id="start">Run checks</button><ol id="results"></ol><div id="frames"></div><script type="module">
const cases=[['Valid experiment renders',`return {marks:[{type:'circle',x:60,y:60,r:15,color:'#397453'}],metrics:[],summary:'ok'};`,'result'],['Parent DOM is unavailable',`return {marks:[],metrics:[],summary:parent.document.body.innerText};`,'error'],['Network requests are blocked',`let blocked=false;try{const xhr=new XMLHttpRequest();xhr.open('GET','https://example.com',false);xhr.send();}catch{blocked=true;}return {marks:[],metrics:[],summary:blocked?'blocked':'NETWORK ESCAPED'};`,'blocked'],['Infinite code times out',`while(true){}`,'error']];
function check(label,code,expected){return new Promise(resolve=>{const iframe=document.createElement('iframe');iframe.sandbox='allow-scripts';iframe.src='/experiment-frame.html';const nonce=crypto.randomUUID();let watchdog;
 const finish=passed=>{clearTimeout(watchdog);removeEventListener('message',receive);iframe.remove();const li=document.createElement('li');li.textContent=(passed?'PASS: ':'FAIL: ')+label;document.querySelector('ol').append(li);resolve();};
 const receive=e=>{if(e.source!==iframe.contentWindow||e.data?.nonce!==nonce)return;if(e.data.type==='ready')iframe.contentWindow.postMessage({type:'render',nonce,params:{},progress:1},'*');else if(e.data.type==='error'||e.data.type==='result')finish(expected==='blocked'?e.data.summary==='blocked':e.data.type===expected);};
 addEventListener('message',receive);iframe.onload=()=>iframe.contentWindow.postMessage({type:'init',nonce,code},'*');document.querySelector('#frames').append(iframe);watchdog=setTimeout(()=>finish(false),5000);
});}
document.querySelector('button').onclick=async e=>{e.target.disabled=true;for(const c of cases)await check(...c);e.target.textContent='Checks complete';};
</script></body></html>
