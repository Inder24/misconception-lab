<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; worker-src blob:; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; media-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"><style>*{box-sizing:border-box}body{margin:0;background:#fbfcff}canvas{display:block;width:100%;height:340px}</style></head><body><canvas aria-label="Interactive experiment visualization" role="img"></canvas><script>
(()=>{
 const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let worker,nonce,job=0,active=null,timer,started=false;
 const safeNumber=(n,lo=-2000,hi=4000)=>typeof n==='number'&&Number.isFinite(n)&&n>=lo&&n<=hi;
 const send=(type,extra={})=>parent.postMessage({type,nonce,...extra},'*');
 function fail(message){clearTimeout(timer);worker?.terminate();worker=null;const requestId=active?.requestId;active=null;send('error',{message,requestId});}
 function validate(result){
  if(!result||!Array.isArray(result.marks)||result.marks.length>300)throw Error('Expected at most 300 drawing marks.');
  const number=(m,key,lo=-2000,hi=4000)=>{if(!safeNumber(m[key],lo,hi))throw Error('Invalid or nonfinite '+m.type+' '+key+'.');};
  for(const m of result.marks){
   if(!m||!['circle','rect','line','text','polyline'].includes(m.type))throw Error('Unknown drawing mark type.');
   if(m.color!==undefined&&!(typeof m.color==='string'&&/^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(m.color)))throw Error('Invalid drawing color.');
   if(m.width!==undefined)number(m,'width',1,10);
   if(m.type==='polyline'){if(!Array.isArray(m.points)||m.points.length<2||m.points.length>500)throw Error('Polyline needs 2–500 points.');for(const p of m.points){if(!p)throw Error('Invalid polyline point.');number(p,'x');number(p,'y');}continue;}
   number(m,'x');number(m,'y');if(m.type==='circle')number(m,'r',0,1000);if(m.type==='rect'){number(m,'w',0,2000);number(m,'h',0,2000);}if(m.type==='line'){number(m,'x2');number(m,'y2');}
   if(m.type==='text'){if(typeof m.text!=='string'||m.text.length>160)throw Error('Invalid drawing text.');if(m.size!==undefined)number(m,'size',12,36);if(m.align!==undefined&&!['left','center','right'].includes(m.align))throw Error('Invalid text alignment.');}
  }
  if(!Array.isArray(result.metrics)||result.metrics.length<1||result.metrics.length>4||result.metrics.some(m=>!m||typeof m.label!=='string'||!m.label.trim()||m.label.length>80||typeof m.value!=='string'||!m.value.trim()||m.value.length>100))throw Error('Invalid experiment metrics.');
  if(typeof result.summary!=='string'||!result.summary.trim()||result.summary.length>600)throw Error('Invalid experiment summary.');
 }
 function draw(result,viewport){
  validate(result);const ratio=Math.min(devicePixelRatio||1,2),w=viewport.width,h=viewport.height;
  canvas.width=w*ratio;canvas.height=h*ratio;canvas.style.height=h+'px';ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#fbfcff';ctx.fillRect(0,0,w,h);
  // A quiet stage leaves scene structure to the experiment, rather than imposing graph axes.
  for(const m of result.marks){
   ctx.fillStyle=m.color||'#315b46';ctx.strokeStyle=m.color||'#315b46';ctx.lineWidth=m.width??2;ctx.lineCap='round';ctx.lineJoin='round';
   if(m.type==='polyline'){ctx.beginPath();m.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();}
   if(m.type==='circle'){ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();}
   if(m.type==='rect')ctx.fillRect(m.x,m.y,m.w,m.h);
   if(m.type==='line'){ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x2,m.y2);ctx.stroke();}
   if(m.type==='text'){ctx.font=`${m.size??16}px system-ui,sans-serif`;ctx.textAlign=m.align||'left';ctx.fillText(m.text,m.x,m.y);}
  }
  canvas.setAttribute('aria-label',result.summary);
 }
 addEventListener('message',event=>{
  if(event.source!==parent||!event.data||typeof event.data!=='object')return;const d=event.data;
  if(d.type==='init'&&!started&&typeof d.code==='string'&&d.code.length<=16000&&typeof d.nonce==='string'){
   started=true;nonce=d.nonce;
   const workerSource=`let experiment;onmessage=e=>{try{if(e.data.type==='init'){experiment=new Function('params','viewport',e.data.code);postMessage({ready:true});return;}const result=experiment(e.data.params,e.data.viewport);const json=JSON.stringify(result,(key,value)=>{if(typeof value==='number'&&!Number.isFinite(value))throw Error('Nonfinite numeric output.');return value;});if(typeof json!=='string'||json.length>100000)throw Error('Experiment output exceeded the drawing limit.');postMessage({id:e.data.id,json});}catch(error){postMessage({id:e.data.id,error:String(error?.message||'Runtime error').slice(0,400)});}};`;
   const url=URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'}));worker=new Worker(url);URL.revokeObjectURL(url);
   worker.onerror=()=>fail('The generated experiment could not run.');
   worker.onmessage=e=>{
    if(e.data?.ready&&!active){clearTimeout(timer);send('ready');return;}
    if(e.data?.error){fail('Sandbox runtime error: '+e.data.error);return;}
    if(!active||e.data?.id!==job||typeof e.data.json!=='string')return;
    clearTimeout(timer);if(e.data.json.length>100000){fail('Experiment output exceeded the drawing limit.');return;}
    try{const result=JSON.parse(e.data.json);draw(result,active.viewport);const requestId=active.requestId;active=null;send('result',{requestId,marks:result.marks,metrics:result.metrics,summary:result.summary});}catch(error){fail(error.message||'Invalid drawing data.');}
   };
   timer=setTimeout(()=>fail('The experiment took too long to initialize.'),2000);worker.postMessage({type:'init',code:d.code});return;
  }
  if(d.nonce!==nonce)return;
  if(d.type==='destroy'){clearTimeout(timer);worker?.terminate();worker=null;active=null;return;}
  if(d.type==='render'&&worker){
   if(active){fail('A sandbox run was requested before the previous run completed.');return;}
   const viewport=d.viewport||{width:innerWidth,height:340,progress:d.progress??1};
   if(!safeNumber(viewport.width,100,2000)||!safeNumber(viewport.height,100,1000)||!safeNumber(viewport.progress,0,1)||!d.params||typeof d.params!=='object'||Object.values(d.params).some(v=>!Number.isFinite(v))){fail('Invalid experiment parameters or viewport.');return;}
   active={requestId:d.requestId,viewport};job++;timer=setTimeout(()=>fail('The experiment timed out; its worker was terminated.'),1500);worker.postMessage({id:job,params:d.params,viewport});
  }
 });
})();
</script></body></html>
